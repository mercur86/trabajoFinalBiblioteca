spring:
  application:
    name: biblioteca-backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:54322/postgres
    username: postgres
    password: postgres
  jpa:
    database: postgresql
    show-sql: true
    hibernate:
      ddl-auto: update

app:
  front:
    url: ${FRONT_URL:http://localhost:4200}

server:
  port: ${SERVER_PORT:8080}
