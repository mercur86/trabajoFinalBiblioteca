<section class="page">
  <header class="page__header">
    <div>
      <h1 class="page__title">Categorías</h1>
      <p class="page__subtitle">Clasificación de los libros de la biblioteca</p>
    </div>
    <a mat-flat-button color="primary" routerLink="/categorias/nueva">
      <mat-icon>add</mat-icon>
      Nueva categoría
    </a>
  </header>

  <mat-form-field appearance="outline">
    <mat-label>Filtrar</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Nombre o descripción" />
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  @if (loading()) {
    <p class="loading">Cargando…</p>
  } @else {
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2">
      <ng-container matColumnDef="idCategoria">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
        <td mat-cell *matCellDef="let row">{{ row.idCategoria }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let row">{{ row.descripcion }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let row">
          <span class="badge" [class.badge--yes]="row.estado" [class.badge--no]="!row.estado">
            {{ row.estado ? 'Activa' : 'Inactiva' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <a mat-icon-button color="primary" [routerLink]="['/categorias', row.idCategoria, 'editar']" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button color="warn" (click)="remove(row)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">Sin categorías</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons aria-label="Seleccionar página" />
  }
</section>
